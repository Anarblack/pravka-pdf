<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Редактор PDF в браузере: переписать строку, добавить надпись и фото, закрасить лишнее. Файлы не покидают устройство.">
<meta name="theme-color" content="#FBFCFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1E25" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Правка PDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Правка PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen tool. A control strip on top (file, tools, context row), below it a light-table workspace with PDF sheets stacked at fit width.
   Blue pencil marks what is selected; yellow marker shows which lines of the PDF can be rewritten. */
:root {
  --ws: #E3E7ED;
  --ws-dot: rgba(40, 56, 84, .11);
  --panel: #FBFCFD;
  --ink: #161A20;
  --muted: #59626E;
  --line: #D1D7DF;
  --pencil: #2350C8;
  --pencil-ink: #FFFFFF;
  --pencil-soft: rgba(35, 80, 200, .10);
  --danger: #B3342B;
  --sheet-shadow: 0 1px 2px rgba(22, 32, 52, .12), 0 10px 30px rgba(22, 32, 52, .12);
  --paper-pencil: #2350C8;
  --marker: rgba(255, 204, 0, .48);
  --ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ws: #111419; --ws-dot: rgba(200, 214, 240, .07); --panel: #1A1E25; --ink: #E7EAEF; --muted: #98A1AD; --line: #2D333C;
    --pencil: #86A6FF; --pencil-ink: #0D1630; --pencil-soft: rgba(134, 166, 255, .15); --danger: #FF8478;
    --sheet-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ws: #111419; --ws-dot: rgba(200, 214, 240, .07); --panel: #1A1E25; --ink: #E7EAEF; --muted: #98A1AD; --line: #2D333C;
  --pencil: #86A6FF; --pencil-ink: #0D1630; --pencil-soft: rgba(134, 166, 255, .15); --danger: #FF8478;
  --sheet-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
body { height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--ws); color: var(--ink); font-family: var(--ui); }
button, select, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }

/* ---------- control strip ---------- */
.bar {
  flex: none; position: relative; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1 var(--ui); letter-spacing: -.01em; white-space: nowrap; margin-right: 4px; }
.brand svg { color: var(--pencil); flex: none; }
.file { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 36ch; font-size: 13px; color: var(--muted); }
.file b { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.badge { flex: none; font: 600 10px/1 var(--ui); text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px; border-radius: 4px; background: var(--pencil-soft); color: var(--pencil); }
.meta { flex: none; font: 400 12px/1 var(--mono); }
.spacer { flex: 1 1 0; min-width: 0; }
.sep { width: 1px; height: 22px; background: var(--line); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  font: 500 13px/1 var(--ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  cursor: pointer; white-space: nowrap; transition: border-color .12s, background-color .12s;
}
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--pencil) 45%, var(--line)); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { width: 34px; padding: 0; }
/* the real file input sits under the cursor: the claude.ai viewer ignores script-driven input.click() */
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; font-size: 0; }
.filebtn:has(input:focus-visible) { outline: 2px solid var(--pencil); outline-offset: 2px; }
.btn.primary { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--pencil) 88%, var(--ink)); }
.btn.danger { color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--pencil-soft); border-color: var(--pencil); color: var(--pencil); }
.btn svg, .tool svg { flex: none; }

.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--ws); }
.tool {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); font: 500 13px/1 var(--ui); cursor: pointer; white-space: nowrap;
}
.tool:hover { color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .10), 0 0 0 1px var(--line); }
.tool[aria-pressed="true"] svg { color: var(--pencil); }

.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 34px; }
.zoom button { width: 32px; height: 100%; border: 0; background: var(--panel); color: var(--ink); font: 500 16px/1 var(--ui); cursor: pointer; }
.zoom button:hover { background: var(--pencil-soft); }
#zLabel { min-width: 54px; border-inline: 1px solid var(--line); font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; }

.ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 48px; padding-block: 7px; border-top: 1px solid var(--line); font-size: 13px; }
.hint { margin: 0; color: var(--muted); line-height: 1.45; max-width: 80ch; }
.props { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.field select, .field input {
  height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); font: 500 13px/1 var(--ui);
}
.field input[type="number"] { width: 70px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
#pBold { width: 32px; height: 32px; padding: 0; font-weight: 700; font-size: 14px; }
.swatch {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px 0 4px; border: 1px solid var(--line); border-radius: 7px;
  font-size: 12px; color: var(--muted); cursor: pointer; background: var(--panel);
}
.swatch input { width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
.swatch input::-webkit-color-swatch-wrapper { padding: 0; }
.swatch input::-webkit-color-swatch { border: 1px solid rgba(0, 0, 0, .18); border-radius: 5px; }
.swatch input::-moz-color-swatch { border: 1px solid rgba(0, 0, 0, .18); border-radius: 5px; }
.props .btn { height: 32px; }

/* ---------- workspace ---------- */
.ws {
  flex: 1 1 auto; min-height: 0; position: relative; overflow: auto; overscroll-behavior: contain;
  background-color: var(--ws); background-image: radial-gradient(var(--ws-dot) 1px, transparent 1.3px); background-size: 20px 20px; background-attachment: local;
}
.pages {
  --s: 1;
  display: flex; flex-direction: column; gap: 22px; width: max-content; min-width: 100%; box-sizing: border-box;
  padding-block: 24px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page {
  position: relative; flex: none; margin-inline: auto; overflow: hidden; background: #fff; box-shadow: var(--sheet-shadow);
  width: calc(var(--pw) * var(--s) * 1px); height: calc(var(--ph) * var(--s) * 1px);
}
.page > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.l-covers, .l-runs, .l-objs { position: absolute; inset: 0; }
.l-runs, .l-objs { pointer-events: none; }
.run, .obj, .cover, .drawing { pointer-events: auto; }

.run, .cover, .drawing, .obj.image, .obj.rect {
  position: absolute;
  left: calc(var(--x) * var(--s) * 1px); top: calc(var(--y) * var(--s) * 1px);
  width: calc(var(--w) * var(--s) * 1px); height: calc(var(--h) * var(--s) * 1px);
}
.run { border-radius: 2px; cursor: text; mix-blend-mode: multiply; }
.tool-edit .run:hover { background: var(--marker); }
.pages:not(.tool-edit) .run { pointer-events: none; }
.l-runs.reveal .run { animation: sweep 1.7s ease both; }
@keyframes sweep { 0%, 100% { background-color: transparent; } 25%, 55% { background-color: var(--marker); } }

.cover { background: var(--cc); cursor: text; }
.cover.sel { outline: 1px dotted var(--paper-pencil); outline-offset: 1px; }

.obj { position: absolute; left: calc(var(--x) * var(--s) * 1px); top: calc(var(--y) * var(--s) * 1px); touch-action: none; }
.obj.image, .obj.rect { cursor: move; }
.obj.rect { background: var(--cc); }
.obj.image img { display: block; width: 100%; height: 100%; max-width: none; pointer-events: none; user-select: none; -webkit-user-select: none; }
.obj.text { cursor: text; }
.txt {
  font-size: calc(var(--fs) * var(--s) * 1px); line-height: 1.2; white-space: pre; color: var(--c);
  font-kerning: none; min-width: 3px; min-height: 1.2em; outline: none; caret-color: var(--paper-pencil);
  user-select: none; -webkit-user-select: none;
}
.obj.editing .txt { user-select: text; -webkit-user-select: text; }
.obj.editing .txt:empty::before { content: "Текст"; color: rgba(22, 26, 32, .32); }
.obj:hover:not(.sel) { outline: 1px dashed color-mix(in srgb, var(--paper-pencil) 55%, transparent); outline-offset: 2px; }
.obj.sel { outline: 1.5px solid var(--paper-pencil); outline-offset: 2px; }
.obj.editing { outline-style: dashed; }

.h-size, .h-move { position: absolute; display: none; }
.obj.sel .h-size {
  display: block; right: -9px; bottom: -9px; width: 12px; height: 12px; box-sizing: border-box;
  background: #fff; border: 1.5px solid var(--paper-pencil); border-radius: 3px; cursor: nwse-resize; touch-action: none;
}
.h-size::before { content: ""; position: absolute; inset: -10px; }
.obj.text.editing .h-move {
  display: inline-flex; align-items: center; justify-content: center; left: -3.5px; top: -26px; height: 20px; padding: 0 7px;
  border-radius: 5px 5px 0 0; background: var(--paper-pencil); color: #fff; cursor: move; touch-action: none;
}
.drawing { border: 1.5px dashed var(--paper-pencil); background: rgba(35, 80, 200, .08); box-sizing: border-box; pointer-events: none; }
.tool-text .page { cursor: crosshair; }
.tool-rect .page { cursor: crosshair; touch-action: none; }

.boot { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
.measure { position: absolute; left: -9999px; top: 0; font-size: 100px; line-height: 1.2; white-space: pre; visibility: hidden; }
.measure i { display: inline-block; width: 1px; height: 0; vertical-align: baseline; }

/* ---------- overlays ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  max-width: min(560px, calc(100% - 32px)); padding: 11px 15px; border-radius: 10px; background: var(--ink); color: var(--panel);
  font: 500 13px/1.4 var(--ui); box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
}
.drop {
  position: fixed; inset: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  display: grid; place-items: center; border: 2px dashed var(--pencil); border-radius: 16px; pointer-events: none;
  background: color-mix(in srgb, var(--panel) 82%, transparent); font: 600 17px/1.4 var(--ui); color: var(--pencil); text-align: center;
}
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(10, 14, 20, .45); }
.card { width: min(420px, 100%); padding: 22px; border-radius: 14px; background: var(--panel); box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
.card h2 { margin: 0 0 8px; font: 600 17px/1.3 var(--ui); text-wrap: balance; }
.card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.card .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

@media (max-width: 640px) {
  .brand span, .tool .lbl { display: none; }
  .file { max-width: 22ch; }
  .tool { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .l-runs.reveal .run { animation: none; }
  .btn { transition: none; }
}
.toast-act { margin-left: 10px; padding: 6px 10px; border: 0; border-radius: 6px; background: var(--pencil); color: var(--pencil-ink); font: 600 13px/1 var(--ui); cursor: pointer; }
</style>
</head>
<body>

<header class="bar">
  <div class="row">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l1.2-4.2L12.4 2.6l3 3-8.2 8.2z"/><path d="M10.9 4.1l3 3"/><path d="M3 15l4.2-1.2" stroke-linecap="round"/></svg>
      <span>Правка PDF</span>
    </div>
    <label class="btn filebtn" id="btnOpen">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5V12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6.2a1 1 0 0 0-1-1H8.2L6.6 3.5H3A1 1 0 0 0 2 4.5z"/></svg>
      Открыть PDF
      <input type="file" id="inPdf" accept="application/pdf,.pdf" title="Открыть PDF — или перетащите файл в окно">
    </label>
    <div class="file" id="fileChip"><b id="fileName">—</b><span class="badge" id="sampleBadge" hidden>пример</span><span class="meta" id="fileMeta"></span></div>
    <div class="spacer"></div>
    <div class="seg" role="toolbar" aria-label="Инструменты">
      <button class="tool" type="button" data-tool="edit" aria-pressed="true" title="Править строки и двигать объекты">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l1-3.6 7.3-7.3 2.6 2.6-7.3 7.3z"/><path d="M9.5 3.9l2.6 2.6"/></svg>
        <span class="lbl">Править</span>
      </button>
      <button class="tool" type="button" data-tool="text" aria-pressed="false" title="Добавить надпись">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 3.5h10M8 3.5v9.5M6 13h4"/></svg>
        <span class="lbl">Текст</span>
      </button>
      <button class="tool" type="button" data-tool="rect" aria-pressed="false" title="Закрасить часть страницы">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="4" width="11" height="8" rx="1"/><path d="M5 10.5l5.5-5M7.5 11.5l4.5-4.5M3.5 8l4-4" stroke-width="1.2"/></svg>
        <span class="lbl">Закрасить</span>
      </button>
    </div>
    <label class="btn filebtn" id="btnPhoto">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.8" cy="6.6" r="1.2"/><path d="M2.4 12l3.6-3.6 2.6 2.6 2-2 3 3"/></svg>
      Фото
      <input type="file" id="inImg" accept="image/*" multiple title="Вставить фото">
    </label>
    <button id="btnUndo" class="btn icon" type="button" title="Отменить (⌘Z)" aria-label="Отменить" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5L2.5 6.5l3 3"/><path d="M2.8 6.5H10a3.5 3.5 0 0 1 0 7H8"/></svg>
    </button>
    <div class="zoom" aria-label="Масштаб">
      <button id="zOut" type="button" title="Мельче" aria-label="Мельче">−</button>
      <button id="zLabel" type="button" title="По ширине окна">100%</button>
      <button id="zIn" type="button" title="Крупнее" aria-label="Крупнее">+</button>
    </div>
    <button id="btnDownload" class="btn primary" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.6 7.2L8 10.6l3.4-3.4M3 13.5h10"/></svg>
      <span>Скачать PDF</span>
    </button>
  </div>

  <div class="ctx" id="ctx">
    <p class="hint" id="hint"></p>
    <div class="props" id="propsText" hidden>
      <label class="field">Шрифт
        <select id="pFont">
          <option value="roboto">Roboto</option>
          <option value="ptsans">PT Sans</option>
          <option value="ptserif">PT Serif</option>
          <option value="ptmono">PT Mono</option>
        </select>
      </label>
      <label class="field">Размер <input id="pSize" type="number" min="3" max="400" step="0.5" inputmode="decimal"></label>
      <button id="pBold" class="btn" type="button" aria-pressed="false" title="Жирный">Ж</button>
      <label class="swatch" title="Цвет текста"><input id="pColor" type="color" value="#161a20">Цвет</label>
      <label class="swatch" id="pCoverWrap" title="Цвет заплатки под текстом"><input id="pCover" type="color" value="#ffffff">Фон</label>
      <button id="pDel" class="btn danger" type="button">Удалить</button>
    </div>
    <div class="props" id="propsImage" hidden>
      <span class="hint">Тяните за угол — размер, с Shift — без пропорций.</span>
      <button id="iFront" class="btn" type="button">Вперёд</button>
      <button id="iBack" class="btn" type="button">Назад</button>
      <button id="iDel" class="btn danger" type="button">Удалить</button>
    </div>
    <div class="props" id="propsRect" hidden>
      <label class="swatch" title="Цвет заливки"><input id="rColor" type="color" value="#ffffff">Цвет</label>
      <button id="rDel" class="btn danger" type="button">Удалить</button>
    </div>
  </div>
</header>

<main class="ws" id="ws">
  <div class="pages tool-edit" id="pages"></div>
  <div class="boot" id="boot">Готовлю редактор…</div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="drop" id="drop" hidden>Отпустите файл:<br>PDF откроется, фото встанет на страницу</div>
<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Открыть другой файл?</h2>
    <p id="mText"></p>
    <div class="acts">
      <button id="mNo" class="btn" type="button">Остаться</button>
      <button id="mYes" class="btn primary" type="button">Открыть другой</button>
    </div>
  </div>
</div>

<script src="vendor/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';</script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
<script>
(() => {
'use strict';

const FONT_B64 = null;
const FAMILIES = {
  roboto: { files: { 400: 'Roboto-Regular', 700: 'Roboto-Bold' } },
  ptsans: { files: { 400: 'PTSans-Regular', 700: 'PTSans-Bold' } },
  ptserif: { files: { 400: 'PTSerif-Regular', 700: 'PTSerif-Bold' } },
  ptmono: { files: { 400: 'PTMono-Regular' } },
};

function b64bytes(s) {

  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

}
async function fontData(file) {
  if (FONT_B64) return b64bytes(FONT_B64[file]);
  const res = await fetch(`fonts/${file}.ttf`);
  if (!res.ok) throw new Error(`шрифт ${file} не загрузился`);
  return new Uint8Array(await res.arrayBuffer());
}
async function loadFonts() {
  const faces = [];
  for (const [fam, def] of Object.entries(FAMILIES)) {
    for (const [w, file] of Object.entries(def.files)) faces.push([`${fam}-${w}`, file]);
  }
  await Promise.all(faces.map(async ([key, file]) => {
    const bytes = await fontData(file);
    fontBytes[key] = bytes;
    const face = new FontFace('E ' + key, bytes.slice().buffer);
    document.fonts.add(face);
    await face.load();
  }));
  for (const key in fontBytes) baseRatio[key] = measureBaseline(key);
}
function measureBaseline(key) {
  const d = div('measure');
  d.style.fontFamily = `"E ${key}"`;
  d.innerHTML = 'Hg<i></i>';
  document.body.append(d);
  const r = d.querySelector('i').getBoundingClientRect().top - d.getBoundingClientRect().top;
  d.remove();
  return r / 100;
}

const io = new IntersectionObserver(entries => {

async function openPdf(bytes, name, sample = false) {

  for (let i = 0; i < pdf.numPages; i++) {

let chain = Promise.resolve();
function queueRender(P) {
  if (P.queued || P.at === scale()) return;
  P.queued = true;

}
async function renderPage(P) {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let k = s * dpr;
  const area = P.vp1.width * P.vp1.height * k * k;
  if (area > 16e6) k *= Math.sqrt(16e6 / area);
  const vp = P.page.getViewport({ scale: k });

  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  await P.page.render({ canvasContext: ctx, viewport: vp, annotationMode: pdfjsLib.AnnotationMode.ENABLE }).promise;
  if (S.pages[P.i] !== P) return;
  P.canvas.replaceWith(c);
  P.canvas = c; P.k = k; P.at = s;
  if (!P.runs) {
    P.runs = await extractRuns(P);
    drawRuns(P);
    if (P.i === 0 && !P.runs.length) { S.scanned = true; renderCtx(); }
    if (P.i === 0 && P.runs.length && !S.revealed) {

      setTimeout(() => P.lRuns.classList.remove('reveal'), 1900);

function fontMeta(P, id) {
  let f = null;
  // commonObjs.get() throws until a render pass has loaded the font
  try { if (P.page.commonObjs.has(id)) f = P.page.commonObjs.get(id); } catch { f = null; }

    name: ((f && f.name) || '').replace(/^[A-Z]{6}\+/, ''),
    serif: !!(f && f.isSerifFont), mono: !!(f && f.isMonospace), bold: !!(f && (f.bold || f.black)),
    generic: (P.styles[id] && P.styles[id].fontFamily) || '',

}
function guessStyle(m) {
  const n = m.name;
  let fam;
  if (/PT\s?Sans|PTSans/i.test(n)) fam = 'ptsans';
  else if (/PT\s?Serif|PTSerif/i.test(n)) fam = 'ptserif';
  else if (/Courier|Mono|Consol|Menlo|Typewriter/i.test(n)) fam = 'ptmono';
  else if (/Times|Georgia|Garamond|Cambria|Minion|Palatino|Baskerville|Bodoni|Didot|Charter|Merriweather|Lora|Playfair|Antiqua|Century/i.test(n)) fam = 'ptserif';

  else if (/Serif/i.test(n) || m.serif || m.generic === 'serif') fam = 'ptserif';
  else if (m.mono || m.generic === 'monospace') fam = 'ptmono';
  else fam = 'roboto';
  const bold = (/Bold|Black|Heavy|Semi.?Bold|Demi|Fett/i.test(n) || m.bold) && !!FAMILIES[fam].files[700];

}
async function extractRuns(P) {
  const tc = await P.page.getTextContent();

    if (!it.str) continue;

    if (size < 3 || m[0] <= 0 || m[3] >= 0 || Math.abs(m[1]) > .02 * size || Math.abs(m[2]) > .02 * size) continue;

  }
  items.sort((a, b) => a.y - b.y || a.x - b.x);

    let line = null;
    for (let j = lines.length - 1; j >= 0 && j >= lines.length - 4; j--) {
      if (Math.abs(lines[j].y - it.y) <= .3 * Math.min(lines[j].size, it.size)) { line = lines[j]; break; }

      run = { str: it.str, x: it.x, y: it.y, w: it.w, size: it.size, font: it.font, fname: it.fname };

}

function sampleColors(P, r) {
  const c = P.canvas, k = P.k;

  const ctx = c.getContext('2d', { willReadFrequently: true });

  const bins = new Map();
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const gx = x + x0, gy = y + y0;
      if (gx >= ix0 && gx < ix1 && gy >= iy0 && gy < iy1) continue;
      const i = (y * W + x) * 4, q = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | d[i + 2] >> 4;
      let b = bins.get(q);
      if (!b) bins.set(q, b = [0, 0, 0, 0]);
      b[0]++; b[1] += d[i]; b[2] += d[i + 1]; b[3] += d[i + 2];
    }
  }
  let best = null;
  for (const b of bins.values()) if (!best || b[0] > best[0]) best = b;
  const bg = best ? [best[1] / best[0], best[2] / best[0], best[3] / best[0]] : [255, 255, 255];
  const far = [];
  for (let y = Math.max(iy0, y0); y < Math.min(iy1, y1); y++) {
    for (let x = Math.max(ix0, x0); x < Math.min(ix1, x1); x++) {
      const i = ((y - y0) * W + (x - x0)) * 4;
      const dist = (d[i] - bg[0]) ** 2 + (d[i + 1] - bg[1]) ** 2 + (d[i + 2] - bg[2]) ** 2;
      if (dist > 3600) far.push(dist, i);
    }
  }
  let ink = [22, 24, 29];
  if (far.length) {
    const idx = [];
    for (let j = 0; j < far.length; j += 2) idx.push(j);
    idx.sort((a, b) => far[b] - far[a]);
    const n = Math.max(1, Math.round(idx.length * .2));
    const sum = [0, 0, 0];
    for (let j = 0; j < n; j++) { const i = far[idx[j] + 1]; sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; }

  }
  return { bg: toHex(...bg), ink: toHex(...ink) };
}

/* ---------- objects ---------- */
function syncObj(o) {
  const P = S.pages[o.page];
  if (!P) return;
  let el = objEls.get(o.id);
  if (!el) {
    el = div('obj ' + o.type);
    el.dataset.id = o.id;
    if (o.type === 'text') {
      const t = div('txt');
      t.spellcheck = false;
      t.setAttribute('autocapitalize', 'off');
      t.contentEditable = 'false';
      t.addEventListener('blur', () => { if (S.editing === o.id) stopEdit(); });
      const g = document.createElement('span');
      g.className = 'h-move';
      g.title = 'Перетащите, чтобы сдвинуть';
      g.innerHTML = MOVE_SVG;
      el.append(t, g);
    } else if (o.type === 'image') {
      const img = new Image();
      img.alt = ''; img.draggable = false;
      img.src = S.images.get(o.img).url;
      el.append(img);
    }
    const h = document.createElement('span');
    h.className = 'h-size';
    h.title = 'Потяните, чтобы изменить размер';
    el.append(h);
    P.lObjs.append(el);
    objEls.set(o.id, el);
  }
  el.classList.toggle('sel', S.sel === o.id);
  setBox(el, o.x, o.y, o.w, o.h);
  if (o.type === 'text') {
    const t = el.firstChild;
    el.style.setProperty('--fs', o.size);
    el.style.setProperty('--c', o.color);
    t.style.fontFamily = `"E ${faceKey(o.fam, o.bold)}"`;

  } else if (o.type === 'rect') {
    el.style.setProperty('--cc', o.color);
  }
  if (o.cover) {
    let c = coverEls.get(o.id);
    if (!c) {
      c = div('cover');
      c.dataset.id = o.id;
      P.lCovers.append(c);
      coverEls.set(o.id, c);
    }
    setBox(c, o.cover.x, o.cover.y, o.cover.w, o.cover.h);
    c.style.setProperty('--cc', o.cover.color);
    c.classList.toggle('sel', S.sel === o.id);
  }
}
function removeObj(id) {
  const o = getObj(id);
  if (!o) return;
  S.objects = S.objects.filter(x => x.id !== id);
  const el = objEls.get(id); if (el) el.remove();
  const c = coverEls.get(id); if (c) c.remove();
  objEls.delete(id); coverEls.delete(id);
  refreshRuns(S.pages[o.page]);
}
function rebuild() {
  for (const el of objEls.values()) el.remove();
  for (const el of coverEls.values()) el.remove();
  objEls.clear(); coverEls.clear();
  S.objects.forEach(syncObj);
  S.pages.forEach(refreshRuns);
  select(getObj(S.sel) ? S.sel : null);
}
function select(id) {
  S.sel = id;
  for (const [oid, el] of objEls) el.classList.toggle('sel', oid === id);
  for (const [oid, el] of coverEls) el.classList.toggle('sel', oid === id);
  renderCtx();
}

}

}

function editRun(P, k, cx, cy) {

/* ---------- photos ---------- */
async function decodeImage(file) {
  try { return await createImageBitmap(file); } catch { /* Safari: HEIC and SVG decode only through <img> */ }
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  return img;
}
async function prepareImage(file) {
  const src = await decodeImage(file);
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  if (!sw || !sh) throw new Error('empty image');
  const MAX = 3000;
  if (file.type === 'image/png' && Math.max(sw, sh) <= MAX) {
    return { bytes: new Uint8Array(await file.arrayBuffer()), kind: 'png', w: sw, h: sh, url: URL.createObjectURL(file) };
  }
  const k = Math.min(1, MAX / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const alpha = /png|webp|gif|svg/.test(file.type);
  if (!alpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(src, 0, 0, w, h);
  if (src.close) src.close();
  const blob = await new Promise(res => c.toBlob(res, alpha ? 'image/png' : 'image/jpeg', .92));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), kind: alpha ? 'png' : 'jpg', w, h, url: URL.createObjectURL(blob) };
}
async function insertImage(file, P = null, at = null) {
  let rec;
  try { rec = await prepareImage(file); }
  catch { toast('Не получилось открыть это изображение. Подойдут JPG, PNG или WebP.'); return; }
  stopEdit();
  P = P || currentPage();
  if (!P) return;
  const iid = 'img' + nextId++;
  S.images.set(iid, rec);
  const k = Math.min(P.vp1.width * .5 / rec.w, P.vp1.height * .45 / rec.h, 1);
  const w = rec.w * k, h = rec.h * k;
  const c = at || visibleCenter(P);
  recordUndo();
  const o = { id: nextId++, type: 'image', page: P.i, img: iid, x: clamp(c.x - w / 2, 0, P.vp1.width - w), y: clamp(c.y - h / 2, 0, P.vp1.height - h), w, h };
  S.objects.push(o);
  syncObj(o);
  setTool('edit');
  select(o.id);
}
function currentPage() {
  const wr = ws.getBoundingClientRect();
  let best = null, bestA = -1;
  for (const P of S.pages) {
    const r = P.el.getBoundingClientRect();
    if (r.top > wr.bottom) break;
    const a = Math.max(0, Math.min(r.bottom, wr.bottom) - Math.max(r.top, wr.top));
    if (a > bestA) { bestA = a; best = P; }

}
function visibleCenter(P) {

  const cx = (Math.max(r.left, wr.left) + Math.min(r.right, wr.right)) / 2;
  const cy = (Math.max(r.top, wr.top) + Math.min(r.bottom, wr.bottom)) / 2;
  return { x: (cx - r.left) / s, y: (cy - r.top) / s };
}

  const r = P.el.getBoundingClientRect(), s = scale();
  return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };

function onObjDown(e, el) {
  const o = getObj(+el.dataset.id);
  if (!o) return;
  if (S.editing === o.id && e.target.closest('.txt')) return;
  const handle = !!e.target.closest('.h-size');
  e.preventDefault();
  if (S.editing !== o.id) stopEdit();
  select(o.id);
  const s = scale(), sx = e.clientX, sy = e.clientY;
  const st = { x: o.x, y: o.y, w: o.w, h: o.h, size: o.size, ew: Math.max(1, el.offsetWidth / s) };

    P.el.removeEventListener('pointerup', up);

/* ---------- export ---------- */
async function rasterCopy() {
  const { PDFDocument } = PDFLib;
  const doc = await PDFDocument.create();
  for (const P of S.pages) {
    let k = 200 / 72;
    const area = P.vp1.width * P.vp1.height * k * k;
    if (area > 24e6) k *= Math.sqrt(24e6 / area);
    const vp = P.page.getViewport({ scale: k });
    const c = document.createElement('canvas');
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await P.page.render({ canvasContext: c.getContext('2d'), viewport: vp, annotationMode: pdfjsLib.AnnotationMode.ENABLE }).promise;
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', .9));
    const img = await doc.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    const pg = doc.addPage([P.vp1.width, P.vp1.height]);
    pg.drawImage(img, { x: 0, y: 0, width: P.vp1.width, height: P.vp1.height });
  }
  return doc;
}
async function buildPdf() {

    doc = await rasterCopy();
    raster = true;
  }
  doc.registerFontkit(fontkit);
  const fonts = {}, imgs = {};
  const font = async key => fonts[key] || (fonts[key] = await doc.embedFont(fontBytes[key], { subset: subsetOk(key) }));
  const image = async id => {
    if (!imgs[id]) { const r = S.images.get(id); imgs[id] = r.kind === 'png' ? await doc.embedPng(r.bytes) : await doc.embedJpg(r.bytes); }
    return imgs[id];
  };
  const pdfPages = doc.getPages();
  for (const P of S.pages) {
    const list = S.objects.filter(o => o.page === P.i);
    if (!list.length) continue;
    const pg = pdfPages[P.i];
    const F = raster
      ? (x, y) => ({ x, y: P.vp1.height - y })
      : (x, y) => { const p = P.vp1.convertToPdfPoint(x, y); return { x: p[0], y: p[1] }; };
    const a = F(0, 0), b = F(1, 0);
    const rotate = degrees(Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI);
    const box = (x, y, w, h) => ({ ...F(x, y + h), width: w, height: h, rotate });
    for (const o of list) {
      if (o.cover) pg.drawRectangle({ ...box(o.cover.x, o.cover.y, o.cover.w, o.cover.h), color: hexRgb(o.cover.color) });
    }
    for (const o of list) {
      if (o.type === 'rect') {
        pg.drawRectangle({ ...box(o.x, o.y, o.w, o.h), color: hexRgb(o.color) });
      } else if (o.type === 'image') {
        pg.drawImage(await image(o.img), box(o.x, o.y, o.w, o.h));
      } else if (o.type === 'text') {
        const key = faceKey(o.fam, o.bold), f = await font(key), br = baseRatio[key];
        const lines = o.str.split('\n');
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].replace(/\t/g, '    ');
          if (!line.trim()) continue;
          const p = F(o.x, o.y + i * LH * o.size + br * o.size);
          pg.drawText(line, { x: p.x, y: p.y, size: o.size, font: f, color: hexRgb(o.color), rotate });
        }
      }
    }
  }
  return { bytes: await doc.save(), raster };
}
function outName() {
  const base = S.name.replace(/\.pdf$/i, '').trim() || 'документ';
  return base + ' (правка).pdf';
}
async function saveLocally(bytes, name, note) {
  const file = new File([bytes], name, { type: 'application/pdf' });
  // on phones the share sheet is the reliable way to put a file into Files
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    const share = () => navigator.share({ files: [file] }).catch(err => {
      if (err.name !== 'AbortError') toast('Не получилось передать файл: ' + err.message);
    });
    try {
      await navigator.share({ files: [file] });
    } catch (err) {
      // the gesture expires while the PDF is being built; a fresh tap opens the sheet
      if (err.name === 'NotAllowedError') toast('PDF готов.', 15000, { label: 'Сохранить', fn: share });
      else if (err.name !== 'AbortError') throw err;
    }
    return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast('Сохранено: ' + name + '.' + note, 5000);
}
async function download() {
  if (busy || !S.pdf) return;
  stopEdit();
  busy = true;
  const btn = $('btnDownload'), lbl = btn.querySelector('span');
  btn.disabled = true;
  lbl.textContent = 'Собираю…';
  try {
    const { bytes, raster } = await buildPdf();
    const name = outName();
    const note = raster ? ' Файл был защищён от изменений, поэтому страницы сохранены картинками.' : '';
    const dl = await downloadsReady;
    if (dl) {
      try {
        await dl.save({ filename: name, data: bytes });
        toast('Сохранено: ' + name + '.' + note, 5000);
      } catch (err) {
        const code = err && err.code;
        if (code === 'rate_limited') toast('Окно сохранения уже открыто.');
        else if (code !== 'declined') toast('Не получилось сохранить файл. Попробуйте ещё раз.');
      }
    } else if (window.claude) {
      toast('Скачивание в этом окне недоступно. Откройте страницу на claude.ai.');
    } else {
      await saveLocally(bytes, name, note);
    }
  } catch (err) {
    console.error(err);
    toast('Не получилось собрать PDF: ' + ((err && err.message) || 'неизвестная ошибка') + '.', 6000);
  } finally {
    busy = false;
    btn.disabled = false;
    lbl.textContent = 'Скачать PDF';
  }
}

/* ---------- start ---------- */
async function boot() {
  if (!window.pdfjsLib || !window.PDFLib || !window.fontkit) {
    $('boot').textContent = 'Не загрузились библиотеки для работы с PDF. Проверьте интернет и обновите страницу.';
    return;
  }
  await loadFonts();
  const bytes = await makeSample();
  await openPdf(bytes, 'пример.pdf', true);
  $('boot').hidden = true;
}
const booted = boot().catch(err => {
  console.error(err);
  $('boot').textContent = 'Редактор не запустился: ' + ((err && err.message) || err);
});
// installed app on desktop Chrome: "Open with → Правка PDF" on a PDF file
if ('launchQueue' in window) {
  window.launchQueue.setConsumer(async params => {
    const h = params.files && params.files[0];
    if (!h) return;
    const f = await h.getFile();
    await booted;
    confirmReplace(() => openFile(f));
  });
}
})();
</script>
